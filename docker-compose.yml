services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount artefacts only; the image already contains the application code.
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/models/best_model.pkl
      - MLFLOW_TRACKING_URI=file:///app/mlruns
      - MLFLOW_ALLOW_FILE_STORE=true
    depends_on:
      - mlflow
    restart: unless-stopped

  # Tracking UI for browsing experiments logged by src/train.py.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri file:///mlruns
      --default-artifact-root file:///mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped
